<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <script type="text/javascript">
        // Controparte di 404.html: ripristina il percorso profondo prima che Blazor legga l'URL.
        // Sta qui, subito dopo la dichiarazione di codifica e prima di ogni altro script, perché
        // deve correggere l'indirizzo prima che il router lo legga.
        // La guardia `l.search[1] === '/'` distingue il rimbalzo dal 404 (che produce `?/rotta`)
        // dal ritorno OAuth (`?code=...`, dove il carattere in posizione 1 è `c`): senza, il
        // codice di autorizzazione verrebbe distrutto e il login non si completerebbe mai.
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }(window.location));
    </script>
    <title>Eton</title>
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Bundle degli stili isolati per componente (Benvenuto.razor.css e simili): lo genera la
         build a partire dai file .razor.css, e senza questo <link> nessuno lo carica. -->
    <link rel="stylesheet" href="Eton.styles.css" />
    <!-- Stesso valore di --sfondo in css/app.css e di background_color nel manifest: è il colore
         con cui il sistema tinge la barra di stato e la schermata d'avvio dell'app installata.
         Discordare significa un lampo di un altro colore a ogni apertura. -->
    <meta name="theme-color" content="#0e1317" />

    <!-- Sembra un elemento vuoto dimenticato, ed è invece indispensabile: la pubblicazione lo
         riempie con la traduzione fra i nomi logici dei file del runtime e i nomi con impronta
         effettivamente presenti sul server (_framework/dotnet.js → dotnet.3ilfxr93yh.js).
         Senza, lo script Blazor parte e poi chiede "dotnet.js", che sul sito pubblicato non
         esiste: 404, e "Failed to start platform". In sviluppo non si vedrebbe mai.
         Va tenuto perché lo ha il modello ufficiale dell'SDK — questo index.html è scritto a
         mano, ed è così che se n'era perso per strada. -->
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <div class="avvio">Caricamento…</div>
    </div>

    <div id="blazor-error-ui">
        Si è verificato un errore imprevisto.
        <a href="" class="reload">Ricarica</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Il segnaposto #[.{fingerprint}] non è decorativo: da .NET 9 questo script viene
         pubblicato con un'impronta nel nome (blazor.webassembly.w3qd1tpl0e.js), e riferirlo
         come "blazor.webassembly.js" dà 404 sul sito pubblicato — cioè un'applicazione che
         non si avvia. Il segnaposto viene risolto sia in pubblicazione sia in sviluppo. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        navigator.serviceWorker?.register('service-worker.js');
    </script>
</body>
</html>
