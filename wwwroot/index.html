<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <script type="text/javascript">
        // Controparte di 404.html: ripristina il percorso profondo prima che Blazor legga l'URL.
        // Sta qui, subito dopo la dichiarazione di codifica e prima di ogni altro script, perché
        // deve correggere l'indirizzo prima che il router lo legga.
        // La guardia `l.search[1] === '/'` distingue il rimbalzo dal 404 (che produce `?/rotta`)
        // dal ritorno OAuth (`?code=...`, dove il carattere in posizione 1 è `c`): senza, il
        // codice di autorizzazione verrebbe distrutto e il login non si completerebbe mai.
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }(window.location));
    </script>
    <title>Eton</title>
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Il font si scarica in parallelo al foglio di stile invece che dopo. Senza questa riga il
         browser scopre di averne bisogno solo quando ha finito di leggere app.css e ha incontrato
         la regola che lo usa: due viaggi in fila invece di due in parallelo, cioè il tempo in cui
         il testo resta disegnato col font di sistema e poi salta.
         'crossorigin' non è un refuso e non è facoltativo: i font si richiedono SEMPRE in modalità
         anonima, anche quando stanno sullo stesso dominio, e senza l'attributo il browser
         scaricherebbe il file due volte — una per il preload e una per il @font-face, che per lui
         sono richieste diverse. -->
    <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Dei due tagli del mono si precarica solo il 600, ed è una scelta: disegna i voti e le
         medie, cioè le cose più grandi e più guardate dell'applicazione, dove la sostituzione
         del font a pagina già disegnata si vede eccome. Il 400 scrive righe di meta a 13px e può
         permettersi di arrivare con calma. Precaricare tutto non è precaricare: sono richieste
         che si contendono la stessa banda, e la più importante arriverebbe più tardi. -->
    <link rel="preload" href="fonts/plex-mono-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Bundle degli stili isolati per componente (Benvenuto.razor.css e simili): lo genera la
         build a partire dai file .razor.css, e senza questo <link> nessuno lo carica. -->
    <link rel="stylesheet" href="Eton.styles.css" />
    <!-- Stesso valore di --sfondo in css/app.css e di background_color nel manifest: è il colore
         con cui il sistema tinge la barra di stato e la schermata d'avvio dell'app installata.
         Discordare significa un lampo di un altro colore a ogni apertura. -->
    <meta name="theme-color" content="#000000" />

    <!-- Sembra un elemento vuoto dimenticato, ed è invece indispensabile: la pubblicazione lo
         riempie con la traduzione fra i nomi logici dei file del runtime e i nomi con impronta
         effettivamente presenti sul server (_framework/dotnet.js → dotnet.<impronta>.js).
         Senza, lo script Blazor parte e poi chiede "dotnet.js", che sul sito pubblicato non
         esiste: 404, e "Failed to start platform". In sviluppo non si vedrebbe mai.
         Va tenuto perché lo ha il modello ufficiale dell'SDK — questo index.html è scritto a
         mano, ed è così che se n'era perso per strada. -->
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <div class="avvio">Caricamento…</div>
    </div>

    <div id="blazor-error-ui">
        Si è verificato un errore imprevisto.
        <a href="" class="reload">Ricarica</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Sta qui e non dentro l'applicazione, come #blazor-error-ui qui sopra e per la stessa
         ragione: deve poter comparire anche quando Blazor non è in condizione di disegnare
         niente. Nasce nascosto; lo mostra lo script in fondo alla pagina. -->
    <div id="aggiornamento-pwa" hidden>
        <span>È disponibile una versione nuova di Eton.</span>
        <button type="button" id="aggiorna-ora">Aggiorna</button>
    </div>

    <!-- Il segnaposto #[.{fingerprint}] non è decorativo: da .NET 9 questo script viene
         pubblicato con un'impronta nel nome (blazor.webassembly.w3qd1tpl0e.js), e riferirlo
         come "blazor.webassembly.js" dà 404 sul sito pubblicato — cioè un'applicazione che
         non si avvia. Il segnaposto viene risolto sia in pubblicazione sia in sviluppo. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Il service worker pubblicato NON si attiva da sé quando arriva una versione nuova: aspetta
        // un messaggio SKIP_WAITING (v. il commento in service-worker.published.js), perché attivarsi
        // sotto i piedi di una sessione aperta mescolerebbe codice vecchio e nuovo nella stessa
        // pagina. Finché nessuno gliel'ha mandato, quel messaggio non arrivava mai: chi ha installato
        // l'app sul telefono restava sulla versione vecchia finché non chiudeva TUTTE le schede
        // aperte — cioè, in pratica, all'infinito. Questo è chi glielo manda.
        navigator.serviceWorker?.register('service-worker.js').then(function (registrazione) {
            if (!registrazione) return;

            var aggiornamentoRichiesto = false;

            function proponi(worker) {
                var banner = document.getElementById('aggiornamento-pwa');
                banner.hidden = false;
                document.getElementById('aggiorna-ora').onclick = function () {
                    banner.hidden = true;
                    aggiornamentoRichiesto = true;
                    worker.postMessage({ type: 'SKIP_WAITING' });
                };
            }

            // Una versione nuova può essere già lì ad aspettare da una visita precedente.
            if (registrazione.waiting) proponi(registrazione.waiting);

            registrazione.addEventListener('updatefound', function () {
                var nuovo = registrazione.installing;
                if (!nuovo) return;
                nuovo.addEventListener('statechange', function () {
                    // 'controller' distingue l'aggiornamento dalla PRIMA installazione: alla prima non
                    // c'è niente da proporre, la versione appena scaricata è già quella in uso.
                    if (nuovo.state === 'installed' && navigator.serviceWorker.controller) proponi(nuovo);
                });
            });

            // Il ricaricamento avviene solo se l'aggiornamento l'ha chiesto l'utente. Senza questa
            // guardia, il clients.claim() della PRIMA installazione — che serve a far funzionare
            // l'app offline da subito — scatenerebbe un controllerchange e quindi un reload della
            // pagina appena aperta, senza che nessuno abbia aggiornato niente.
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (aggiornamentoRichiesto) location.reload();
            });
        });
    </script>
</body>
</html>
