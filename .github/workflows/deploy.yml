name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # L'app è servita da https://<utente>.github.io/eton/, non dalla radice del dominio:
      # senza questa riscrittura il browser cercherebbe _framework/ sulla radice e non lo troverebbe.
      #
      # Si corregge il SORGENTE, PRIMA di pubblicare. Farlo dopo, sul file pubblicato, sembra più
      # mirato ed è invece un errore: la pubblicazione registra in service-worker-assets.js
      # l'hash SHA-256 di ogni file, e il service worker li scarica con un controllo di integrità.
      # Modificare index.html dopo che il suo hash è stato calcolato lo fa rifiutare — l'app non
      # si avvia affatto, con un messaggio che parla di SRI e non nomina il base href.
      - name: Correggi il base href
        run: sed -i 's|<base href="/" />|<base href="/eton/" />|g' wwwroot/index.html

      - name: Publish
        run: dotnet publish Eton.csproj -c Release -o publish

      # Senza .nojekyll, GitHub Pages scarta le cartelle che iniziano con l'underscore:
      # _framework, cioè tutto il runtime .NET.
      - name: Aggiungi .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
